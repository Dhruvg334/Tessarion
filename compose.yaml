name: tessarion-infrastructure

services:
  qdrant:
    image: ${QDRANT_IMAGE:-qdrant/qdrant:latest}
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/6333'"]
      interval: 10s
      timeout: 5s
      retries: 10

  neo4j:
    image: ${NEO4J_IMAGE:-neo4j:5-community}
    restart: unless-stopped
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-tessarion-local-change-me}
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1G
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p ${NEO4J_PASSWORD:-tessarion-local-change-me} 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15

  phoenix:
    image: ${PHOENIX_IMAGE:-arizephoenix/phoenix:latest}
    restart: unless-stopped
    ports:
      - "6006:6006"
    volumes:
      - phoenix-data:/mnt/data
    healthcheck:
      test: ["CMD-SHELL", "wget --spider --quiet http://localhost:6006/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15

volumes:
  qdrant-data:
  neo4j-data:
  neo4j-logs:
  phoenix-data:
